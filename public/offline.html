<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#C4622D">
    <title>ArtisanHub - Hors connexion</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        body { display: grid; min-height: 100vh; place-items: center; margin: 0; background: #FDFAF7; color: #2C1A0E; }
        main { max-width: 420px; padding: 2rem; text-align: center; }
        .logo { display: inline-grid; width: 76px; height: 76px; place-items: center; margin-bottom: 1rem; border-radius: 22px; background: #C4622D; color: #fff; font-size: 2.25rem; }
        h1 { margin: 0 0 .75rem; }
        p { line-height: 1.6; color: #5C3D1E; }
        button { border: 0; border-radius: 10px; padding: .75rem 1rem; background: #C4622D; color: #fff; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <div class="logo" aria-hidden="true">🏺</div>
        <h1>Vous êtes hors connexion</h1>
        <p>ArtisanHub n'arrive pas à joindre le serveur. Vérifiez votre connexion puis réessayez.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
</body>
</html>
